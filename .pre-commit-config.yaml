repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff — corrections Python
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff — format Python
        entry: uv run --locked ruff format
        language: system
        types: [python]
