name: Responsive

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    # Contrôle visible, non requis par le ruleset ; un échec reste un échec.
    name: Responsive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium
      - name: Vérifier les pages et navigations responsive
        run: npm run test:responsive
      - name: Conserver le rapport, les captures et les traces d'échec
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: responsive-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: warn
