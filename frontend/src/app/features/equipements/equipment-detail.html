<section class="feature-page" aria-labelledby="equipment-title">
  <a
    class="back-link page-action secondary"
    [routerLink]="['..']"
    [queryParams]="{ q: search() || null }"
    (click)="focusContent()"
    ><span aria-hidden="true">←</span><span>Retour au matériel</span></a
  >

  @if (equipment(); as item) {
    <h1 id="equipment-title">{{ item.name }}</h1>
    <app-demo-image [source]="item.image" [eager]="true" />
    <dl class="business-card">
      <div>
        <dt>Identifiant</dt>
        <dd>{{ item.id }}</dd>
      </div>
      <div>
        <dt>Emplacement</dt>
        <dd>{{ item.location }}</dd>
      </div>
    </dl>
    <a
      class="declaration-link page-action"
      [routerLink]="['../../incidents/nouveau', item.id]"
      [queryParams]="{ q: search() || null }"
      >Déclarer un incident</a
    >
  } @else {
    <h1 id="equipment-title">Équipement introuvable</h1>
    <p>Aucun équipement ne correspond à cet identifiant.</p>
  }
</section>
