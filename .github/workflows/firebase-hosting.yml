name: Firebase Hosting

on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        required: true
      pr-number:
        type: string
        required: true
      workflow-sha:
        type: string
        required: true
    secrets:
      service-account:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    name: Publier Hosting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      # Ne pas interrompre un envoi Firebase déjà commencé.
      group: firebase-${{ inputs.pr-number || 'live' }}
      cancel-in-progress: false
    steps:
      - name: Récupérer uniquement la configuration du workflow appelant
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.workflow-sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
          # Les fichiers racine firebase.json et .nvmrc sont inclus en mode cone.
      - name: Installer Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Télécharger le build contrôlé de cette exécution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend/dist/terrimaint/browser
      - name: Installer la CLI Firebase sans identifiants
        run: npm install --prefix "$RUNNER_TEMP/firebase-tools" --no-audit --no-fund firebase-tools@15.34.2
      - name: Refuser une source périmée ou une PR externe/fermée
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
        with:
          script: |
            const { isCurrent } = require('./.github/scripts/hosting-target.cjs');
            const current = await isCurrent({ github, context, sha: process.env.SOURCE_SHA, prNumber: process.env.PR_NUMBER });
            core.setOutput('publish', String(current));
            if (!current) await core.summary.addRaw('Publication ignorée : la source a changé ou la PR est fermée/externe.').write();
      - name: Publier le canal et consigner URL et commit
        if: steps.current.outputs.publish == 'true'
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.service-account }}
          FIREBASE_CLI: ${{ runner.temp }}/firebase-tools/node_modules/.bin/firebase
          SOURCE_SHA: ${{ inputs.source-sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
          CHANNEL_ID: ${{ inputs.pr-number && format('pr-{0}', inputs.pr-number) || 'live' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/deploy-hosting.cjs
